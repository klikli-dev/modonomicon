name: Deploy to GitHub Pages

on:
  push:
    branches:
      - documentation

# Grant the minimum permissions required by the official GitHub Pages actions:
# read the repo, publish a deployment, and mint an OIDC token for Pages.
# https://github.com/actions/deploy-pages#usage
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in progress and the latest queued run. Do not cancel in-progress runs, as we
# want to let the current deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install
      - name: Build website
        run: yarn build

      # Configures the Pages site (base path, etc.) for the deployment below.
      # Docs: https://github.com/actions/configure-pages
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Packages the build output as the artifact the deploy job publishes.
      # Docs: https://github.com/actions/upload-pages-artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Docs: https://github.com/actions/deploy-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
