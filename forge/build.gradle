plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
    id 'java-library'
}

if (System.getenv('MOD_VERSION') != null) {
    mod_version = System.getenv('MOD_VERSION')
}
version = mod_version

base {
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

configurations {
    embed {
        transitive = false
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
    into("META-INF/jarjar") {
        from configurations.embed
    }
}

minecraft {
    accessTransformer.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        // applies to all the run configs below
        configureEach {
            workingDir.set(project.layout.projectDirectory.dir('run'))

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'

            jvmArgs '-XX:+AllowEnhancedClassRedefinition', '-XX:+IgnoreUnrecognizedVMOptions'
        }

        client {
            workingDir.set(project.layout.projectDirectory.dir('run'))

            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        server {
            args '--nogui'

            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        data {
            workingDir.set(layout.projectDirectory.dir('run-data'))

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', project.mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources/'), '--existing', layout.projectDirectory.dir('src/main/resources/')

            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        // Client-side data generation (launch target forge_userdev_client_data), mirroring NeoForge's
        // runClientData. Kept as an alternative to the server-side 'data' run above.
        clientData {
            workingDir.set(layout.projectDirectory.dir('run-data'))

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', project.mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources/'), '--existing', layout.projectDirectory.dir('src/main/resources/')

            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

//Workaround for the empty 26.3 client-extra (MCP config 26.3-20260918.230105 ships no vanilla client
//resources): builds a stub jar whose file name starts with 'client-extra' so Forge's
//ForgeUserdevLaunchHandler.findJarOnClasspath picks it up for the minecraft game module, providing a
//stub assets/minecraft/lang/en_us.json. Without it vanilla Language.<clinit> NPEs during
//ForgeBootstrap, before any mod code runs. See forge/dev-run-resources/README.md.
//Remove once client-extra is fixed upstream.
def clientExtraStubJar = tasks.register('clientExtraStubJar', Jar) {
    archiveBaseName.set('client-extra-dev-stub')
    archiveVersion.set('')
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('dev-run-resources'))
    from('dev-run-resources') {
        include 'assets/**'
    }
}

dependencies {
    //note: no mixin annotationProcessor here. With mojmap there is no obfuscation to remap to,
    //and the mixin AP emits "Unable to locate obfuscation mapping" errors without a gradle mixin plugin.
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    compileOnly project(":common")

    //Workaround for empty client-extra on 26.3 (MCP config 26.3-20260918.230105 ships no vanilla
    //client resources): provides a stub assets/minecraft/lang/en_us.json so vanilla Language.<clinit>
    //does not NPE during ForgeBootstrap. Runtime-only: never compiled, never packaged into the mod jar.
    //See forge/dev-run-resources/README.md. Remove once client-extra is fixed upstream.
    runtimeOnly files(clientExtraStubJar)

    //Jei
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    //The neoforge jar is fat and embeds common/lib/gui/api classes, so its transitive
    //mezz.jei modules must be excluded: otherwise the run's module path contains the same
    //packages twice (e.g. mezz.jei.api.constants in jei.neoforge and jei.common.api) and
    //JPMS resolution fails with "Modules jei.neoforge and jei.common.api export package ...".
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") {
        exclude group: "mezz.jei"
    }

//    implementation "vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-FORGE"

    //commonmark
    //mark it for forge to add to the classpath
    implementation "org.commonmark:commonmark:${commonmark_version}"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:${commonmark_version}"
    implementation "org.commonmark:commonmark-ext-ins:${commonmark_version}"
    //and include it in the jar via META-INF/jarjar (ForgeGradle 7 dropped jarJar)
    embed "org.commonmark:commonmark:${commonmark_version}"
    embed "org.commonmark:commonmark-ext-gfm-strikethrough:${commonmark_version}"
    embed "org.commonmark:commonmark-ext-ins:${commonmark_version}"
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

//Disable test compilation as a) we are not using tests and b) it fails due to not being able to access jei in common
compileTestJava {
    enabled = false
}
test {
    failOnNoDiscoveredTests = false
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    //for some reason we need item textures in forge too for dev runtime, so we have to set a strategy
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(":common").sourceSets.main.allSource)
}

tasks.named('build').configure { dependsOn('jar') }

tasks.withType(ProcessResources).configureEach {
    //for some reason we need item textures in forge too for dev runtime, so we have to set a strategy
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()

            from components.java

            pom {
                name = mod_name
                description = 'Data-driven minecraft in-game documentation with progress visualization.'
                url = 'https://github.com/klikli-dev/modonomicon'
                licenses {
                    license {
                        name = 'MIT AND CC-BY-4.0'
                        url = 'https://github.com/klikli-dev/modonomicon#licensing'
                    }
                }
                scm {
                    connection = 'scm:git:ssh:git@github.com:klikli-dev/modonomicon.git'
                    url = 'https://github.com/klikli-dev/modonomicon'
                }
                //remove commonmark from the pom, otherwise forge will include it in the classpath twice
                //once from JiJ, once as transitive dep.
                withXml {
                    asNode().dependencies.dependency.each { dep ->
                        if (dep.groupId.text() == 'org.commonmark') {
                            assert dep.parent().remove(dep)
                        }
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = "cloudsmith"
            url = "https://maven.cloudsmith.io/klikli-dev/mods/"
            def releasesRepoUrl = "https://maven.cloudsmith.io/klikli-dev/mods/"
            def snapshotsRepoUrl = "https://maven.cloudsmith.io/klikli-dev/mods/"
            url = version.toString().endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            credentials {
                username = System.getenv('MAVEN_USER')
                password = System.getenv('MAVEN_PASS')
            }
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/${it.name}")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
